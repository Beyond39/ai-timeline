[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-memory"
version = "0.4.2"
description = "Provider-neutral, traceable archive and cross-project search for LLM conversations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GPT-SaaS contributors" }]
dependencies = []

[project.scripts]
ai-memory = "ai_memory.cli:main"

[tool.setuptools.packages.find]
include = ["ai_memory*"]

[tool.setuptools.package-data]
ai_memory = ["static/*.html", "static/*.css", "static/*.js"]
