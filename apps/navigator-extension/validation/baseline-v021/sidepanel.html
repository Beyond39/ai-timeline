<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话航图侧栏</title><link rel="stylesheet" href="ui/styles.css"><script type="module" src="ui/app.js"></script></head>
<body data-mode="panel">
  <header class="app-header"><div class="brand"><div class="brand-icon" aria-hidden="true">◈</div><div><strong>对话航图</strong><span>当前讨论 · 本地保存</span></div></div><div class="actions"><button id="capture-button" class="btn primary">采集 / 更新当前对话</button><button id="open-workspace" class="btn">项目地图 ↗</button><button id="import-button" class="btn">导入</button><button id="refresh-button" class="btn">刷新</button></div></header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main class="shell">
    <aside class="library"><div class="eyebrow">本地项目与当前对话</div><label class="field"><span>项目</span><select id="project-select"></select></label><div class="actions small"><button id="new-project" class="btn">＋ 新建</button><button id="rename-project" class="btn">重命名</button><button id="export-button" class="btn">备份</button><button id="delete-project" class="btn danger">删除项目</button></div><p id="project-stats" class="muted"></p><select id="conversation-select" aria-label="当前已保存对话"></select><div id="conversation-list" class="conversation-list"></div><label class="field"><span>阅读路径 / 分支</span><select id="path-select"></select></label><label class="check"><input id="all-paths" type="checkbox">地图包含其他已存路径</label><p class="footnote">未加载历史和未展示分支按实际采集范围记录，来源时间可能未知。</p></aside>
    <section class="navigator"><div class="workspace-heading"><div><div class="eyebrow">讨论片段</div><h1 id="map-title">先保存一条真实对话</h1><p id="map-subtitle" class="muted">保存后即可逐轮阅读。</p></div><span id="map-count" class="badge"></span></div><form id="search-form" class="search-bar"><input id="search-input" type="search" placeholder="搜索项目原文" aria-label="搜索"><button class="btn primary" type="submit">搜索</button><button id="clear-search" class="btn" type="button">清除</button></form><section id="search-results" class="search-results" hidden></section><div class="map-toolbar"><span class="badge">Snake</span><select id="topic-filter" aria-label="主题筛选"></select><select id="state-filter" aria-label="筛选整理状态"><option value="">全部整理状态</option><option value="unorganized">未整理</option><option value="pending">待确认</option><option value="confirmed">已确认</option><option value="needs_review">需要复核</option></select><button id="organize-button" class="btn primary">整理当前对话</button><button id="manage-topics" class="btn">管理主题</button><button id="undo-button" class="btn">撤销</button></div><div id="legend" class="legend"></div><div id="map" class="map"></div></section>
    <section id="reader" class="reader" aria-label="完整问答阅读器"><div class="empty"><h2>完整 Q/A 阅读</h2><p>打开 ChatGPT 对话，点击工具栏插件图标授权，然后点击“采集 / 更新”。预览后保存到一个本地项目。</p></div></section>
  </main>
  <input id="file-input" type="file" accept=".json,application/json" hidden><dialog id="preview-dialog" class="preview-dialog"></dialog><dialog id="edit-dialog"></dialog>
</body></html>
