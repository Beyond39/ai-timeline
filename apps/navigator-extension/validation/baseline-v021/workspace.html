<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话航图 · AI Conversation Visual Navigator</title><link rel="stylesheet" href="ui/styles.css"><script type="module" src="ui/app.js"></script></head>
<body data-mode="workspace">
  <header class="app-header"><div class="brand"><div class="brand-icon" aria-hidden="true">◈</div><div><strong>对话航图</strong><span>AI Conversation Visual Navigator · 本地 V0.2.1</span></div></div><div class="actions"><button id="capture-button" class="btn primary">采集当前 ChatGPT 对话</button><button id="import-button" class="btn">导入 JSON / 备份</button><button id="refresh-button" class="btn" title="重新读取已保存数据">刷新</button><button id="open-workspace" class="btn">完整项目页 ↗</button></div></header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main class="shell">
    <aside class="library"><div class="eyebrow">我的本地项目</div><label class="field"><span>项目</span><select id="project-select" aria-label="选择本地项目"></select></label><div class="actions small"><button id="new-project" class="btn">＋ 新建</button><button id="rename-project" class="btn">重命名</button></div><p id="project-stats" class="muted"></p><div class="actions small"><button id="export-button" class="btn">导出备份</button><button id="delete-project" class="btn danger">删除项目</button></div><hr><div class="eyebrow">项目中的对话</div><select id="conversation-select" aria-label="筛选对话"></select><div id="conversation-list" class="conversation-list"></div><label class="field"><span>阅读路径 / 分支</span><select id="path-select"></select></label><label class="check"><input id="all-paths" type="checkbox">地图包含其他已存路径</label><p class="footnote">来源时间未知时按对话内顺序展示。连线表示浏览顺序；采集时间单独记录。</p></aside>
    <section class="navigator"><div class="workspace-heading"><div><div class="eyebrow">PROJECT MAP</div><h1 id="map-title">把讨论放回项目里</h1><p id="map-subtitle" class="muted">真实对话 → 连续片段 → 全部问答 → 本地原文</p></div><span id="map-count" class="badge"></span></div><form id="search-form" class="search-bar"><input id="search-input" type="search" placeholder="搜索对话标题、完整问题与回答正文" aria-label="搜索项目原文"><button class="btn primary" type="submit">搜索</button><button id="clear-search" class="btn" type="button">清除</button></form><section id="search-results" class="search-results" hidden></section><div class="map-toolbar"><span class="badge">Snake · 顺序视图</span><select id="topic-filter" aria-label="筛选主题"></select><select id="state-filter" aria-label="筛选整理状态"><option value="">全部整理状态</option><option value="unorganized">未整理</option><option value="pending">待确认</option><option value="confirmed">已确认</option><option value="needs_review">需要复核</option></select><button id="organize-button" class="btn primary">整理当前对话</button><button id="manage-topics" class="btn">管理主题</button><button id="undo-button" class="btn">撤销最近修改</button></div><div id="legend" class="legend" aria-label="主题图例"></div><div id="map" class="map"></div></section>
    <section id="reader" class="reader" aria-label="完整问答阅读器"><div class="empty"><span class="empty-symbol">↗</span><h2>从地图走进原文</h2><p>选择一个彩色节点，阅读它实际包含的全部 Q/A。每一轮都能进入完整对话并定位原始消息。</p></div></section>
  </main>
  <input id="file-input" type="file" accept=".json,application/json" hidden><dialog id="preview-dialog" class="preview-dialog"></dialog><dialog id="edit-dialog"></dialog>
</body></html>
